<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>総監口頭試験 想定問答カード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:#0B2545;
    --bg2:#0E2C52;
    --card:#12315C;
    --card-back:#0F2A4F;
    --grid: rgba(150,196,255,0.07);
    --line: rgba(150,196,255,0.22);
    --line-strong: rgba(150,196,255,0.4);
    --amber:#E8A33D;
    --amber-deep:#412402;
    --text:#EAF3FF;
    --text-dim:#8FADCF;
    --text-faint:#5C7699;
    --danger:#E2807A;
    --ok:#7FCB9E;
    --ok-deep:#0d3a22;
    --warn:#F0B860;
    --warn-deep:#4a2f04;
    --pending:#E2807A;
    --pending-deep:#4a1410;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Zen Kaku Gothic New',sans-serif; overscroll-behavior:none;}
  body{
    min-height:100vh;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    padding:14px 14px 28px;
    display:flex; flex-direction:column; align-items:center;
  }

  .app{ width:100%; max-width:460px; }

  .topbar{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .brand{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; color:var(--text-faint); text-transform:uppercase; }
  .brand b{ color:var(--amber); }
  .counter{ font-family:'Space Mono',monospace; font-size:12px; color:var(--text-dim); }
  .counter b{ color:var(--text); font-size:14px; }

  .progress-track{ width:100%; height:3px; background:rgba(150,196,255,0.12); margin-bottom:14px; position:relative; }
  .progress-fill{ height:100%; background:var(--amber); transition: width .25s ease; }

  .filters{
    display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; margin-bottom:14px;
    padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  .filters::-webkit-scrollbar{ height:4px; }
  .filters::-webkit-scrollbar-thumb{ background:var(--line-strong); }
  .chip{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:0.02em;
    padding:5px 9px; border:1px solid var(--line); color:var(--text-dim);
    background:transparent; cursor:pointer; user-select:none; white-space:nowrap; flex:0 0 auto;
  }
  .chip.active{ border-color:var(--amber); color:var(--amber-deep); background:var(--amber); }
  .chip.unmastered{ border-color:var(--pending); color:var(--pending); }
  .chip.unmastered.active{ background:var(--pending); color:var(--pending-deep); border-color:var(--pending); }

  .stage{ position:relative; perspective:1400px; }
  .card{
    position:relative;
    min-height:400px;
    cursor:pointer;
    user-select:none;
    transform-style:preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:relative;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--card);
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    min-height:400px;
  }
  .face.back{
    position:absolute; inset:0; top:0; left:0;
    transform: rotateY(180deg);
    background:var(--card-back);
  }

  .face::before, .face::after{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  }
  .face::before{ top:-1px; left:-1px; border-top:2px solid var(--amber); border-left:2px solid var(--amber); }
  .face::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--amber); border-right:2px solid var(--amber); }

  .titleblock{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--line);
    font-family:'Space Mono',monospace; font-size:10.5px; color:var(--text-dim);
    gap:8px;
  }
  .titleblock .no{ color:var(--amber); font-weight:700; flex:0 0 auto; }
  .titleblock .cat{ color:var(--text-dim); text-align:right; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conf-badge{
    flex:0 0 auto; font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:3px; white-space:nowrap;
  }
  .conf-ok{ background:var(--ok); color:var(--ok-deep); }
  .conf-warn{ background:var(--warn); color:var(--warn-deep); }
  .conf-pending{ background:var(--pending); color:var(--pending-deep); }

  .cardbody{ flex:1; padding:22px 18px; display:flex; align-items:center; overflow-y:auto; }
  .qtext{
    font-family:'Shippori Mincho', serif; font-weight:500; font-size:19px; line-height:1.75; color:var(--text);
  }
  .atext{
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:400; font-size:14.5px; line-height:1.85; color:var(--text);
  }
  .facelabel{
    position:absolute; top:8px; right:10px; font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:0.15em;
    color:var(--text-faint); z-index:2;
  }

  .face.back .lines{ position:absolute; inset:0; background-image: repeating-linear-gradient(transparent, transparent 31px, var(--grid) 32px); pointer-events:none; }

  .hint{ text-align:center; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-faint); margin-top:10px; letter-spacing:0.05em; }

  .controls{ display:flex; align-items:center; gap:8px; margin-top:16px; }
  .btn{
    flex:1; font-family:'Zen Kaku Gothic New',sans-serif; font-size:13.5px; font-weight:700;
    padding:12px 8px; background:#163B6E; color:#FFFFFF; border:1px solid var(--line-strong);
    border-radius:6px; cursor:pointer; text-align:center;
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .btn:active{ background:#1E4B8A; transform: translateY(1px); box-shadow:none; }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .btn.wide{ flex:2; }
  .btn.amber{ background:var(--amber); color:#2A1700; border-color:var(--amber); }
  .btn.amber:active{ background:#F5B559; }
  .btn.mastered{ background:#163B6E; border-color:var(--ok); color:var(--ok); }
  .btn.mastered.on{ background:var(--ok); color:#0a2f1c; border-color:var(--ok); }

  .rowbtns{ display:flex; gap:8px; margin-top:8px; }

  .kbd-hint{ display:flex; justify-content:center; gap:14px; margin-top:14px; font-family:'Space Mono',monospace; font-size:10px; color:var(--text-faint); }
  .kbd-hint kbd{ border:1px solid var(--line); padding:1px 5px; border-radius:3px; color:var(--text-dim); }

  .footer-note{ text-align:center; font-size:11px; color:var(--text-faint); margin-top:10px; font-family:'Space Mono',monospace; }
  .footer-note b{ color:var(--amber); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">総監<b>口頭試験</b>想定問答</div>
    <div class="counter"><b id="idx">1</b> / <span id="total">65</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="filters" id="filters"></div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="facelabel">FRONT — 質問</div>
        <div class="titleblock">
          <span class="no" id="noLabelFront">No.01</span>
          <span class="cat" id="catLabelFront">出典 / 分類</span>
          <span class="conf-badge" id="confBadgeFront"></span>
        </div>
        <div class="cardbody">
          <div class="qtext" id="mainTextFront"></div>
        </div>
      </div>
      <div class="face back">
        <div class="lines"></div>
        <div class="facelabel">BACK — 回答案（PREP）</div>
        <div class="titleblock">
          <span class="no" id="noLabelBack">No.01</span>
          <span class="cat" id="catLabelBack">出典 / 分類</span>
          <span class="conf-badge" id="confBadgeBack"></span>
        </div>
        <div class="cardbody">
          <div class="atext" id="mainTextBack"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hintText">タップして裏返す — 回答案（PREP）</div>

  <div class="controls">
    <button class="btn" id="prevBtn">← 前へ</button>
    <button class="btn wide amber" id="flipBtn">裏返す</button>
    <button class="btn" id="nextBtn">次へ →</button>
  </div>
  <div class="rowbtns">
    <button class="btn mastered" id="masterBtn">覚えた ✓</button>
    <button class="btn" id="shuffleBtn">シャッフル</button>
    <button class="btn" id="resetBtn">絞り込み解除</button>
  </div>
  <div class="rowbtns">
    <button class="btn amber" id="speakBtn">🔊 読み上げ</button>
    <button class="btn" id="speakBothBtn">質問→回答を連続再生</button>
  </div>
  <div class="kbd-hint"><span><kbd>←</kbd> <kbd>→</kbd> 移動</span><span><kbd>Space</kbd> 裏返す</span><span><kbd>S</kbd> 読み上げ</span></div>

  <div class="footer-note">覚えた項目は <b id="masteredCount">0</b> / <span id="totalCount">65</span> 件。進捗は端末に保存されます。</div>
</div>

<script>
const ALL_CARDS = [{"no": 1, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "経済性管理", "question": "測量対象を190箇所から50箇所に絞り込む際、GISで除外した根拠の妥当性はどう検証したか", "prep": "除外基準の妥当性は、対象施設の整備年次の新しさで担保しました。本市の下水道整備は市街化区域から調整区域へ順に進めており、MPは調整区域整備のため工事年次が新しく、完成図書の正確性が高いです。具体的には、浸水想定区域図との重ね合わせと、完成図書上の高さと浸水深の突合という2つの客観基準で除外箇所を判定し、恣意的な判断を排除しました。", "confidence": "○（模擬問答で深掘り済）"}, {"no": 2, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "経済性管理", "question": "74%削減という数字は当初からの目標値か、結果的な副産物か", "prep": "74%という削減率は、当初からの目標値ではなく、手法設計の結果です。期限内完了という制約から、まず対応可能な範囲を逆算し、浸水想定区域外・完成図書確認済みという客観基準を先に設計しました。その基準に基づき機械的に絞り込んだ結果、190箇所が50箇所、約74%減となったものであり、数値ありきの絞り込みではありません。", "confidence": "○"}, {"no": 3, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "経済性⇔安全", "question": "測量箇所を絞ったことで、安全管理上見落としたリスクはなかったか", "prep": "測量箇所を絞ったことによる安全上の見落としリスクは限定的だったと考えています。除外基準自体が、ハザードマップと完成図書という信頼性の高い2つの情報源で二重に確認した、安全側に立った客観的基準だったためです。恣意的な判断を排除できており、コスト優先の判断が安全管理を損なうことは避けられたと考えています。", "confidence": "△（要強化）"}, {"no": 4, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "安全管理", "question": "高さ調整困難箇所で防水強化＋BCP明記を選んだ理由。高さ調整という根本対策を諦めた判断基準は", "prep": "判断基準は、ハシゴを使わず点検できるかどうかでした。浸水深2〜3mある箇所では、制御盤をそこまで上げると高所作業が必要となり、維持管理業者へのヒアリングでこの支障が明らかになりました。該当箇所は高さ調整を断念し、防水強化とBCP明記という代替策としましたが、これは津波・高潮時には住民自身も高所避難が前提であり、施設に求められる安全性は点検時の安全性ではなく浸水後の迅速な復旧だと整理したためです。", "confidence": "○（模擬問答で深掘り済・重要ロジック）"}, {"no": 5, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "安全管理", "question": "BCP訓練（自家発電起動訓練）の効果はどう測定したか。訓練後に計画自体を見直した点は", "prep": "効果不十分と判定した箇所は、技術的対策ではなく、災害協定を結ぶ建設業者との連携・理解が浅い箇所を指します。協定内容や締結の新しさ、業者へのヒアリングをもとに判断しました。協定があっても実際に業者が円滑に対応できなければ意味がないため、該当箇所にはBCP訓練を追加し、自家発電起動訓練を通じて実地の連携を確認・強化しました。", "confidence": "○（模擬問答で深掘り済）"}, {"no": 6, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "情報管理", "question": "データ分析結果と現場担当者の意見が食い違った場合、最終判断は誰がどう行ったか", "prep": "データ分析結果と現場担当者の意見が食い違った場合は、維持管理担当者の判断を優先します。災害発生時に早期復旧を担うのは維持管理担当者であり、公益確保の観点から復旧のしやすさを最優先すべきと考えるためです。またGIS上の管路台帳は手書きの完成図面等をもとに入力されており正確性が100%ではないため、データ分析のみに依拠せず現場確認を組み合わせる手順を最初から設計しました。", "confidence": "○（模擬問答で深掘り済）"}, {"no": 7, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "情報管理", "question": "GISによる浸水深再算出の仕組みは、誰が・どの頻度で更新する想定か。属人化リスク対策は", "prep": "GISによる浸水深再算出の仕組みは、区域内の複数職員が操作できるよう、操作手順をマニュアル化しています。更新は浸水想定区域の見直し等の制度改定時を基本とし、属人化を避けるため特定の担当者だけに依存しない体制を意識しています。", "confidence": "△（要強化）"}, {"no": 8, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "社会環境管理", "question": "「公益確保」を達成できたと判断する根拠・指標は何か", "prep": "公益確保を達成できたと判断する根拠は、浸水時にも下水道サービスを継続提供できる状態を、期限内の計画策定によって確保できたことです。防水強化やBCP明記、訓練による復旧力向上を通じて、住民生活に不可欠なインフラ機能を維持する体制を整えました。", "confidence": "△（要強化）"}, {"no": 9, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "人的資源管理", "question": "限られた人員を集中投入した際、具体的にどう配置転換・指導を行ったか", "prep": "限られた人員は、絞り込んだ測量対象箇所に重点配置しました。また、地理情報システムの操作を管路調査担当者にも指導し、他業務にも応用できるスキルとして伝えることを意識しました。単なる作業手伝いではなく本来業務にも役立つ知識として共有することで、モチベーション向上と組織全体のスキル底上げにつなげました。", "confidence": "○（模擬問答で具体例を確保）"}, {"no": 10, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "統合・優先順位", "question": "5つの管理の中で最も優先度が高かったのは経済性管理とのことだが、他の4管理とどうバランスを取ったか", "prep": "経済性管理を最優先としつつ、他の管理を損なわないよう仕組みで補いました。測量絞り込みでは客観基準で安全上の見落としを防ぎ、高さ調整困難箇所は代替策とBCP訓練で安全性を確保し、データ分析には現場確認を組み合わせて情報の正確性を担保しました。優先順位を明確にしつつ、他管理を仕組みで支える構成としました。", "confidence": "○"}, {"no": 11, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "リーダーシップ", "question": "部局間協議や現場担当者との調整で、意見の対立があった場面とその収め方", "prep": "部局間協議では、代替対策のコスト・安全性データを提示し、客観的根拠に基づいて合意形成を図りました。（具体的な対立場面は本番前にもう一例思い出しておく必要があります。）", "confidence": "△（要準備）"}, {"no": 12, "source": "業務内容の詳細", "group": "業務内容の詳細", "category": "評価・改善", "question": "この業務を今振り返って、改善すべきだった点は何か", "prep": "振り返ると、人的資源管理の仕組み化がやや弱かった点が反省点です。GISの仕組みを構築した際、操作を担当者間で共有する体制づくりまで十分手が回りませんでした。この反省は、その後のストックマネジメント計画でマニュアル化を行う判断につながりました。", "confidence": "△（要準備）"}, {"no": 13, "source": "経歴票全体", "group": "経歴票", "category": "キャリア一貫性", "question": "下水道、浄水、下水道、ストックマネジメント、漁港と分野を移っているが、一貫して意識してきた管理視点は何か", "prep": "下水道、浄水、耐水化、ストックマネジメント、漁港保全と分野は変わりましたが、一貫して意識してきたのは、限られた予算・人員・期限という制約の中で、複数の管理要素をバランスさせる視点です。ただし、その視野は経験とともに広がってきたと考えています。経歴１の段階では経済性・人的資源・情報・安全管理を意識する程度でしたが、経歴３のMP耐水化計画では5つの管理をほぼ網羅する形にまで至りました。無理に全ての経歴で5管理を揃えて語るのではなく、経験を積むごとに管理できる範囲が広がっていった成長の過程として説明したいと考えています。", "confidence": "○"}, {"no": 14, "source": "経歴票全体", "group": "経歴票", "category": "キャリア成長", "question": "「主任」から「主査」へ立場が変わった時期（経歴４）に、管理の仕方はどう変化したか", "prep": "主査になってからは、個別業務の実務管理に加え、組織内のデータ管理体制構築など、より広い視点での管理を担うようになりました。ストックマネジメント計画では、複数業者・複数担当者からのデータ集約という組織横断的な課題に対し、マニュアル化による標準化という仕組みづくりで対応しました。", "confidence": "△（要準備）"}, {"no": 15, "source": "経歴票全体", "group": "経歴票", "category": "経験の連続性", "question": "経歴３（MP耐水化）の前段階である経歴１・２の経験は、経歴３にどう活きたか", "prep": "経歴1の管渠設計での照査経験や、経歴2の庁内調整・合意形成の経験が、耐水化計画での関係者調整や品質確保の判断に活きました。特に経歴2で培った、合意形成に時間を要する案件を見極める感覚は、耐水化計画の優先順位づけにも通じるものがありました。", "confidence": "△（要準備）"}, {"no": 16, "source": "経歴票（整合性）", "group": "経歴票", "category": "職名整合性", "question": "「業務責任者・主任」という立場で、業務内容の詳細に書かれた「業務全体を統括する立場」をどう両立させたか", "prep": "MP耐水化計画では、前段のコンサル委託での監督員経験により策定プロセスを把握していました。本業務は予算を伴わない自前策定だったため、上司から業務全体を統括する立場を任され、全体管理を行いました。職名は業務責任者・主任ですが、実質的な統括の裁量を委ねられていたということです。", "confidence": "○（対応準備済）"}, {"no": 17, "source": "経歴票（経歴４）", "group": "経歴票", "category": "情報管理", "question": "ストックマネジメント計画のデータベース化管理は、情報管理の観点でどんな課題があったか", "prep": "ストックマネジメント計画では、複数担当者が複数業者からデータを受領しGISに集約する構造上、集約作業を各担当に任せると属人化は防げますが、入力漏れやエラーが生じやすいというジレンマがありました。これに対し、操作マニュアルを作成し標準化することで、情報管理の精度と人的資源管理上の属人化リスクの両立を図りました。", "confidence": "○（模擬問答で整理済・因果の誇張なし）"}, {"no": 18, "source": "経歴票（経歴５）", "group": "経歴票", "category": "総監視点の応用", "question": "漁港施設の保全計画は下水道分野と異なる制約（漁業関係者との調整等）があったと思うが、管理手法をどう応用・変更したか", "prep": "漁港施設の保全計画では、漁業者という新たな利害関係者への説明・合意形成が加わり、下水道分野に比べ社会環境管理の比重が増しました。複数の点検業者との合同打合せで進捗・品質を統合管理し、追加補修箇所が判明した際は漁協と調整の上、計画の平準化・見直しを行っています。", "confidence": "△（要準備）"}, {"no": 19, "source": "経歴票全体", "group": "経歴票", "category": "将来像・CPD", "question": "現時点（漁港保全担当）から、今後どのように総合技術監理の視点を業務に活かしていきたいか", "prep": "現時点では砂防・海岸工事の発注者として、複数工事間の資源融通という視点を意識的に実践していきたいと考えています。分野を問わず、限られた資源を客観的な基準で優先順位づけし配分するという、これまで一貫して培ってきた視点を、組織横断的な業務に活かしていきたいと考えています。", "confidence": "○"}, {"no": 20, "source": "体系的知識", "group": "体系的知識", "category": "5管理定義", "question": "総合技術監理の5つの管理の定義を説明せよ", "prep": "総合技術監理の5つの管理とは、経済性管理、人的資源管理、情報管理、安全管理、社会環境管理です。事業やプロジェクトを、コストだけでなく、人・情報・安全・周辺環境への影響まで含めて総合的に俯瞰し、最適な意思決定を行うための管理体系です。MP案件では、予算がなく期限も限られる中、GISを活用して測量対象を絞り込み、限られた人員・期限内での生産性を最大化しました。", "confidence": "○"}, {"no": 21, "source": "体系的知識", "group": "体系的知識", "category": "トレードオフ", "question": "経済性管理と安全管理はしばしばトレードオフの関係にあるが、一般的にどう調整すべきか", "prep": "経済性管理と安全管理のトレードオフは、リスクを可視化した上で、無制限に対策を積み増すのではなく、施設の重要度と受益人口の規模によって優先順位をランク付けし、投資水準を差別化することで調整します。重要度が高い箇所には手厚い対策を、そうでない箇所は許容可能なリスクとして必要最小限にとどめるという考え方です。", "confidence": "○"}, {"no": 22, "source": "体系的知識", "group": "体系的知識", "category": "リスクマネジメント", "question": "リスクマネジメントにおける「回避・低減・移転・保有」の違いを説明せよ", "prep": "リスクマネジメントには回避・低減・移転・保有という4つの対応があります。回避は原因そのものをなくすこと、低減は影響を小さくすること、移転は保険等で第三者に移すこと、保有はリスクをあえて受け入れることです。MP案件では、想定浸水深以上に高さ調整できる箇所は回避、それが維持管理上困難な箇所は防水強化とBCP明記という低減で対応しました。", "confidence": "○"}, {"no": 23, "source": "体系的知識", "group": "体系的知識", "category": "人的資源管理理論", "question": "人的資源管理における動機づけ理論を業務にどう活かせるか", "prep": "人的資源管理は、必要な人材を確保・配置し、モチベーション管理や教育を通じて能力を発揮できる環境を整える管理です。MP案件では限られた人員を重点配置するとともに、地理情報システムの操作を管路調査担当者にも指導し、他業務にも応用できるスキルとして伝えることでモチベーション向上と組織のスキル底上げを図りました。", "confidence": "△（要準備）"}, {"no": 24, "source": "体系的知識", "group": "体系的知識", "category": "情報セキュリティ", "question": "情報管理におけるセキュリティの3要素（機密性・完全性・可用性）を説明せよ", "prep": "情報セキュリティの3要素は機密性・完全性・可用性です。機密性は許可された者だけがアクセスできる状態、完全性はデータが正確で改ざん・欠損がない状態、可用性は必要な時に情報を使用できる状態を指します。MP案件では、現場確認を組み合わせることでデータの完全性を担保し、GISの継続更新の仕組みで可用性を確保しました。", "confidence": "○"}, {"no": 25, "source": "体系的知識", "group": "体系的知識", "category": "環境アセスメント", "question": "社会環境管理における環境アセスメントの位置づけを説明せよ", "prep": "環境アセスメントとは、新規事業の実施前に周辺環境への影響を事前に調査・予測・評価し、結果次第で計画自体を見直す、意思決定プロセスに組み込まれた手続きです。MP耐水化計画では、対象が既設施設であり地形改変や新たな排水を伴わないため、周辺環境への影響が小さいと判断し、アセスメントに相当する検討は行いませんでした。", "confidence": "△（要準備）"}, {"no": 26, "source": "体系的知識", "group": "体系的知識", "category": "トレードオフ概念", "question": "総合技術監理の視点から見た「トレードオフ」とは何か、具体例を交えて説明せよ", "prep": "総合技術監理におけるトレードオフとは、複数の管理目標が同時には満たせない状況で、優先順位をつけ最適な妥協点を見出す考え方です。MP案件では、経済性管理を最優先としつつ、安全管理・情報管理は代替策や仕組み化により水準を落とさず両立させる形でトレードオフを調整しました。", "confidence": "○"}, {"no": 27, "source": "体系的知識", "group": "体系的知識", "category": "BCP/BCM", "question": "BCP（事業継続計画）とBCMの違いを説明せよ", "prep": "BCPは緊急時にどう行動するかを定めた計画そのものであり、BCMはそのBCPを策定・訓練・見直しし継続的に運用する管理活動です。MP案件では、防水強化と合わせてBCPへの明記を行い、さらに自家発電起動訓練という形でBCMとして継続的に運用する体制を整えました。", "confidence": "○"}, {"no": 28, "source": "技術者倫理", "group": "技術者倫理", "category": "倫理綱要", "question": "技術士倫理綱要で最も重要と考える項目は何か", "prep": "技術士倫理綱要の中で最も重要と考えるのは公益確保です。地方公務員として管理するインフラは、私利私欲のためではなく公共のために整備・維持されるべきものだからです。", "confidence": "○"}, {"no": 29, "source": "技術者倫理", "group": "技術者倫理", "category": "利益相反", "question": "公益確保と顧客（所属組織）の利益が相反した場合、どう行動するか", "prep": "公益確保について組織の判断と自分の考えが異なる場合は、自分の意見とその根拠をしっかり説明した上で、最終的には組織の判断に従います。自分に見えていない別の公益的視点が組織側にある可能性があるためです。ただし、予算優先で必要な点検を省略するなど、明らかに公益を損なうと判断される場合には、意見を述べ続ける責任があると考えています。", "confidence": "○（模擬問答で整理済）"}, {"no": 30, "source": "技術者倫理", "group": "技術者倫理", "category": "倫理的葛藤経験", "question": "過去に倫理的に判断に迷った経験はあるか", "prep": "倫理的判断に迷った経験としては、予算制約の中で安全対策を一部代替策にとどめた判断について、公益確保の観点から妥当かどうかを検討した場面が近いと考えています。コストと安全性のバランスをどこまで許容するかという点で、慎重な判断が求められました。", "confidence": "△（要準備）"}, {"no": 31, "source": "技術者倫理", "group": "技術者倫理", "category": "公益通報", "question": "内部告発（公益通報）についてどう考えるか", "prep": "公益通報は最終手段と考えています。まず課内・組織内で問題を共有し、話し合いによる解決を図ります。それでも改善が見られず、特に法令遵守に関わる問題であれば、職場の顧問弁護士など第三者に相談し、客観的な助言を踏まえた上で通報の要否を判断します。", "confidence": "○（模擬問答で整理済）"}, {"no": 32, "source": "技術者倫理", "group": "技術者倫理", "category": "説明責任", "question": "技術者としての説明責任（アカウンタビリティ）をどう果たしてきたか", "prep": "説明責任は、部局間協議や進捗報告の場で、判断の根拠とリスクを明確に説明し、合意形成を図ることで果たしてきました。特にMP案件では、代替対策のコスト・安全性データを示しながら関係部署との調整を行いました。", "confidence": "○"}, {"no": 33, "source": "継続研鑽", "group": "継続研鑽", "category": "CPD計画", "question": "技術士取得後、どのように継続研鑽（CPD）を行っていく予定か", "prep": "技術士取得後は、技術士会の研修に参加するだけでなく、県庁内の技術士会で自身の業務経験を発表する側としても関わっていきたいと考えています。他部門の技術士との情報交換を通じて、専門外の知見も継続的に吸収していきたいと考えています。", "confidence": "△（要準備）"}, {"no": 34, "source": "継続研鑽", "group": "継続研鑽", "category": "資格活用", "question": "総合技術監理部門取得後、業務にどう活かしたいか", "prep": "総合技術監理部門取得後は、発注者という立場だからこそできる、複数工事間の資源融通という視点を意識的・体系的に実践していきたいと考えています。実際に、砂防工事の残土を海岸工事へ搬出し、他市の砂防工事とも調整した実績があります。今後はこうした調整を個々の気づきに頼らず、仕組み化・定常化していきたいと考えています。", "confidence": "○（模擬問答で具体的実績を確保・強い回答）"}, {"no": 35, "source": "継続研鑽", "group": "継続研鑽", "category": "指導・育成", "question": "今後、部下や後輩の指導にどう関わっていきたいか", "prep": "後輩の指導では、自身が総監的視点を持つに至った経験、特に限られた資源をどう優先順位づけして配分するかという判断軸を、具体的な業務を通じて伝えていきたいと考えています。", "confidence": "△（要準備）"}, {"no": 36, "source": "継続研鑽", "group": "継続研鑽", "category": "技術動向", "question": "最近関心を持っている技術動向・制度改正は何か", "prep": "最近関心を持っているのは、インフラ分野でのGIS・データ活用や、防災・減災に関する制度動向です。特に発注者として、複数工事間の情報共有・資源融通をより仕組み化する方法に関心があります。", "confidence": "△（要準備・最新情報要確認）"}, {"no": 37, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "事業選定理由", "question": "佐賀市の下水道事業を取り上げた理由。他の分野（浄水、漁港等）ではなく下水道を選んだ根拠は", "prep": "佐賀市の下水道事業を取り上げた理由は、経歴の中で最も深く関与し、地方創生との関連、生活環境の改善や産業への貢献も具体的に語れる分野だったためです。", "confidence": "○"}, {"no": 38, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "情報管理", "question": "取組1（能動的運転管理）：AIによるシミュレーションの精度担保はどう考えるか。AI誤判断時のフェイルセーフは", "prep": "AIによるシミュレーションは、あくまで判断支援と位置づけ、最終的な運転操作は施設管理者が承認する仕組みとすることでフェイルセーフを確保します。", "confidence": "△（要準備）"}, {"no": 39, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "ガバナンス", "question": "取組1：栄養塩供給と赤潮リスクのトレードオフを情報管理で解決としたが、最終的な運転判断の責任主体・ガバナンスは", "prep": "最終的な運転判断の責任は、事業主体である市が負う体制を想定しています。県とはデータ共有・測定箇所選定で連携しますが、最終的な意思決定権は市に一元化することで責任の所在を明確にします。", "confidence": "△（要準備）"}, {"no": 40, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "ステークホルダー調整", "question": "取組1：漁業組合との説明会で反対意見が出た場合の対応は", "prep": "漁業組合との説明会で反対意見が出た場合は、栄養塩供給によるメリットをデータで客観的に示し、段階的な試行運転を通じて信頼を積み上げていく方針です。", "confidence": "△（要準備）"}, {"no": 41, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "合意形成", "question": "取組2：複線化の事業費確保のための経営戦略会議・使用料見直しは、住民合意形成にどれくらいの期間を要すると想定しているか", "prep": "使用料改定は議会承認プロセスも含め複数年単位を要すると想定し、段階的な複線化計画と並行して合意形成を進めていく方針です。", "confidence": "△（要準備）"}, {"no": 42, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "客観性", "question": "取組2：フレキシブルな工法選択は、実際にどんな基準で「住宅がある箇所」と判断するのか。基準の客観性は", "prep": "住宅がある箇所かどうかは、住宅密集度や生活道路の利用状況といった定量的な指標で判断し、担当者の主観による恣意的な判断を排除する仕組みが必要と考えています。", "confidence": "△（要準備）"}, {"no": 43, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "環境負荷", "question": "施策1：半導体等重要製品の地方拠点立地で「地下水が豊富」を理由に挙げたが、地下水位低下等の環境負荷とのトレードオフは検討したか", "prep": "地下水位低下等の環境負荷については、取水量の上限を設定しモニタリングを行うことで、産業利用と地下水保全の両立を図る必要があると考えています。", "confidence": "△（要準備・弱点）"}, {"no": 44, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "セキュリティ", "question": "施策1：既存倉庫・共同倉庫の活用によるコスト削減は、セキュリティ（安全管理）とトレードオフにならないか", "prep": "共同倉庫を活用する場合は、重要度に応じたゾーニングと入退室管理を組み合わせることで、コスト削減と安全性を両立させる必要があると考えています。", "confidence": "△（要準備）"}, {"no": 45, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "公益確保", "question": "施策2：宇宙・ドローン研究拠点の「軍事利用」に言及した点について、技術士として公益確保の観点からどう考えるか", "prep": "宇宙・ドローン技術は民生・防衛の両方に使われ得るデュアルユース技術であるという認識を持った上で、住民への丁寧な情報開示と用途の透明性確保が、公益確保の観点から不可欠だと考えています。", "confidence": "△（要準備・重点）"}, {"no": 46, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "情報開示", "question": "施策2：「後から軍事利用と知った場合」というシナリオは、事前の情報開示・住民説明のプロセスに問題があったのではないか。どう改善すべきか", "prep": "立地計画の段階から、想定される用途区分を開示し、住民説明会を前倒しで実施することで、後から軍事利用と分かるといった事態を避けるべきだと考えています。", "confidence": "△（要準備・重点）"}, {"no": 47, "source": "筆記試験（記述式）", "group": "筆記試験（記述式）", "category": "総括", "question": "記述式全体を通じて、5つの管理のうち最も難しかったトレードオフの調整はどれか、一言で", "prep": "5つの管理の中で最も難しかったのは、栄養塩供給と水質保全という経済性管理と社会環境管理の調整でした。定量的な線引きの基準がなく、AIによるシミュレーションという情報管理の仕組みで補う必要があった点が、最も苦労した部分です。", "confidence": "○"}, {"no": 49, "source": "経歴票（経歴２）", "group": "経歴票", "category": "経済性⇔安全", "question": "浄水施設再編構想において「早期更新による安全確保」と「LCCを考慮した投資平準化」のバランスをどう取ったか", "prep": "地下水枯渇リスクは課内で共通認識としてデータ把握しており、切迫していた旧町側の検討・整備を先行させました。合意形成に時間を要する主力浄水場は、拙速に結論を出さず十分な協議期間を確保する方針とし、結果的に更新時期が分散してLCC平準化につながりました。", "confidence": "○（模擬問答で整理済）"}, {"no": 50, "source": "経歴票（経歴２）", "group": "経歴票", "category": "リーダーシップ", "question": "その判断（旧町先行・主力浄水場後ろ倒し）は主体的に行ったのか、上司の指示によるものか", "prep": "方針決定自体は上司の判断でした。私自身は、庁内関係部署との調整の場で状況説明と調整役を担い、方針への理解形成に関わるとともに、業務委託の進捗管理を通じて実務面で方針を支えました。", "confidence": "○（模擬問答で整理済・受け身に聞こえない説明）"}, {"no": 51, "source": "経歴票（経歴５）", "group": "経歴票", "category": "情報管理", "question": "複数の点検業者間で判定基準が食い違った場合、どう調整したか", "prep": "現在の点検は次期10ヵ年計画策定のためのもので、前回計画策定時の点検基準がベースとして存在していました。まずこの既存基準と各業者の判定基準をすり合わせ、加えて基準・要綱の改定有無もチェックした上で、業者間・係内で情報共有を行いました。", "confidence": "○（模擬問答で整理済）"}, {"no": 48, "source": "経歴票全体／自己研鑽", "group": "経歴票", "category": "総括・自己研鑽", "question": "これまで失敗した業務の中で、総合技術監理の知識などがあれば解決したかもというエピソードがあれば教えてください", "prep": "MP耐水化計画において、GISによる絞り込みをもとに高さ調整が必要な箇所をリストアップしましたが、机上のデータだけで判断し、実際には2〜3mもの高さ調整が維持管理上困難であることに、当初気づけませんでした。維持管理担当者から指摘を受けて初めて、現地を見ずに判断していたことに気づかされました。総合技術監理でいう情報管理の視点、机上データの限界を認識し現場の知見と組み合わせる重要性を、当時は十分に意識できていなかったのだと思います。この反省から、その後はデータ分析結果と現場確認・維持管理担当者の意見を組み合わせる手順を自ら設計し、以降の判断に活かしました。", "confidence": "○（模擬問答で完成・No.6との一貫性あり）"}, {"no": 52, "source": "現業務（発注者）", "group": "現業務（発注者）", "category": "安全⇔情報管理", "question": "発注者として、受注者の安全管理体制を具体的にどう確認・管理しているか", "prep": "安全管理チェックシートに基づき現場を確認し、軽微な不備は口頭で注意しますが、改善されない場合や重大な不備は写真で記録し、事故発生時の責任所在を明確にすることでリスクを認識させています。これは安全管理だけでなく情報管理の側面も持ち、工期内に撮影した写真を時系列で整理し経時データとして蓄積することで、改善状況が客観的に追跡できる仕組みとしています。", "confidence": "○（模擬問答で整理済）"}, {"no": 53, "source": "現業務（発注者）", "group": "現業務（発注者）", "category": "社会環境⇔経済性⇔安全管理", "question": "海岸工事において、漁業者や地域住民との調整で心当たりのある場面はあるか", "prep": "潮遊溝整備工事では、有明海の休漁期以外の打設不可という漁業への配慮に加え、干満差により日中の水位が下がらず、近隣排水ポンプも農業用水利用のため使えないという制約から、作業時間を干潮時に合わせる必要がありました。これは工期遅延という経済性管理上のリスクに対し、潮汐表という情報を業者と共有することで工程を最適化する対応です。ただし干潮時が早朝に寄る場合もあり、過重労働を防ぐため労働時間の順守を現場代理人に指示するなど、安全管理の観点にも配慮しました。社会環境管理・経済性管理のトレードオフを情報共有で調整しつつ、そこから派生する安全管理上のリスクにも目を配りました。", "confidence": "○（模擬問答で整理済・3管理連鎖の強い事例）"}, {"no": 54, "source": "オープニング・動機", "group": "オープニング・動機", "category": "総括・動機", "question": "なぜ総合技術監理部門を受験しようと思ったのか", "prep": "きっかけは、総合技術監理は管理職が扱う分野だと思っていたところ、業務内容の詳細に記載した耐水化計画のような係員としての業務の中でも、実は5つの管理を意識した判断を自然と行っていたことに気づいたことです。この気づきを独学で終わらせず、体系的に学び資格として証明することで、後進育成につなげたいと考えました。自分が資格を持つことで、周囲の係員にも総監的視点は管理職だけのものではないと示すことができ、組織全体のレベルアップにつながると考えています。", "confidence": "○（模擬問答で整理済）"}, {"no": 55, "source": "オープニング・動機", "group": "オープニング・動機", "category": "総括・動機", "question": "総合技術監理部門と、他の技術部門（上下水道部門・建設部門等）との違いは何か", "prep": "上下水道部門のような技術部門は、特定の専門分野における技術力そのものを深めることを重視します。一方、総合技術監理部門は、個別の専門技術を前提としつつ、5つの管理の関係性、特にトレードオフをどう調整し事業全体を最適化するかという横断的な視点を重視します。専門部門が深さを追求するのに対し、総監は俯瞰と統合を担う立場だと考えています。", "confidence": "○（模擬問答で整理済）"}, {"no": 56, "source": "オープニング・動機", "group": "オープニング・動機", "category": "総括・動機", "question": "資格取得後、業務や組織にとって何が変わると考えるか", "prep": "資格取得により、事業のリスクを早期に察知し、5つの管理の視点から最適化・効率化を図る力が体系的に裏付けられると考えています。また組織の中では、これまで係長クラスが担っていたようなマネジメント的な役割を、係員という立場でも一部担えるようになり、業務の幅が広がると考えています。これは自分自身のスキルアップにとどまらず、後進育成にもつながり、組織全体としての総監的視点の底上げにつながると考えています。", "confidence": "○（模擬問答で整理済・動機と一貫したストーリー）"}, {"no": 57, "source": "経歴票（経歴１）", "group": "経歴票", "category": "経済性⇔人的資源管理", "question": "経歴１（下水道区域見直し・管渠設計管理）について、経済性管理以外の視点はあるか（人的資源管理）", "prep": "経歴１の業務は経済性管理（設計の照査・品質確保）が中心に見えますが、人的資源管理の視点も含まれています。図面だけでは分からない箇所は現場測量が必要でしたが、その際、管路整備係の後輩をなるべく同行させ、現場での経験を積ませることを意識していました。これは測量作業の効率化だけでなく、若手職員の育成という人的資源管理上の狙いも兼ねた対応でした。", "confidence": "○（模擬問答で整理済）"}, {"no": 58, "source": "経歴票（経歴１）", "group": "経歴票", "category": "情報管理", "question": "経歴１について、情報管理の視点はあるか", "prep": "情報管理の観点では、現場測量の際に既存の竣工図と現地の状況を突合し、相違があれば適宜修正をかけて管路台帳（GIS）のアップデートに努めていました。また測量結果を課内で共有できる環境を整え、後続の設計・維持管理業務でも活用できるようにすることで、作業の重複を防ぎ効率化を図りました。", "confidence": "○（模擬問答で整理済）"}, {"no": 59, "source": "経歴票（経歴１）", "group": "経歴票", "category": "安全管理", "question": "経歴１について、安全管理の視点はあるか", "prep": "安全管理の観点では、公務員という立場上、測量作業に必ずしも習熟しているとは言えず、作業に時間を要することもありました。そのため、通勤・通学のピーク時間帯を避けて測量を行うなど、交通量が多い時間帯での作業リスクを避け、事故防止に配慮していました。", "confidence": "○（模擬問答で整理済）"}, {"no": 60, "source": "自己評価", "group": "自己評価", "category": "総括・自己評価", "question": "技術士としての、ご自身の強みは何だと考えるか", "prep": "私の強みは、目の前の業務目的だけでなく、そこから得られる情報を別の目的にも活用できないか、という小さな気づきを持てる点だと考えています。実際に、発注者として現場の安全チェックを行う際、単に不備を指摘するだけでなく、撮影した写真を時系列で整理し経時データとして蓄積することで、改善状況を客観的に追跡できる仕組みに発展させました。一つの作業から複数の価値を引き出す視点が、自分の強みだと考えています。", "confidence": "○（模擬問答で整理済）"}, {"no": 61, "source": "自己評価", "group": "自己評価", "category": "総括・自己評価", "question": "技術士としての、ご自身の弱みは何だと考えるか", "prep": "私の弱みは、他者への説明や事前の巡り、確認が不足しがちな点だと考えています。MP耐水化計画で、GISのデータをもとに高さ調整が必要な箇所をリストアップした際、机上のデータだけで判断し、維持管理担当者への事前確認が不足していたため、後から指摘を受けて気づくということがありました。この反省から、その後はデータ分析結果と現場確認を組み合わせる手順を自ら設計し、改善に努めています。", "confidence": "○（模擬問答で整理済・No.48と表裏一体）"}, {"no": 62, "source": "経歴票全体", "group": "経歴票", "category": "経歴説明（オープニング）", "question": "経歴を説明してください。", "prep": "私はこれまで、佐賀市の上下水道局と農林水産部において、施設の計画・設計・管理業務に携わってまいりました。経歴に沿ってご説明します。\n最初の経歴は、2014年から2017年、下水道工務課での管渠設計業務です。\n新たに開発される分譲地における処理方式の決定を担当しました。下水道と浄化槽のLCCを比較する経済性の観点と、開発周辺の汚水処理方式との連たん性を考慮した社会環境の観点から、整備区域の見直しと管渠設計を行いました。\n次に、2017年から2019年、浄水課での浄水施設再編・更新構想の策定です。\n築50年を超える主力浄水場の更新時期の検討と、合併した旧町の浄水施設の統合・再編計画を担当しました。旧町では地下水源の枯渇が進んでおり、主要浄水場からの引込み整備も含めた構想策定が必要でした。早期更新による安全確保とLCCを考慮した投資平準化のバランスをとりながら、業務委託の進捗管理と庁内関係部署との調整を行いました。\n続いて、2019年から2023年、下水道企画室での耐水化計画策定業務です。\nマンホールポンプ施設を対象とした浸水対策計画の立案と管理を担当しました。浸水時においても下水道サービスを継続するという公益確保の観点から、期限内に計画を策定することが最重要管理項目でした。当初190箇所を測量する予定でしたが、限られた人員と工期では完了困難なリスクがありました。そこでGISを活用して浸水想定区域外の箇所を客観的基準で除外し、測量対象を50箇所、約74%削減しました。また制御盤の高さ調整が困難な箇所については、防水機能の強化とBCPへの明記で代替対策を講じました。この業務が私の総監部門における業務内容の詳細となっております。\n次に、2023年から2024年、再び下水道工務課でのストックマネジメント計画策定業務です。\n複数の点検・調査業者から受領したデータをGISに紐づけてデータベース化し、計画策定業務を期限内に発注するための工程管理を担当しました。GIS紐づけ作業に時間を要し期限内発注が困難になるリスクがあったため、入力作業のマニュアルを作成して標準化を図り、工程遅延を防ぎました。\n最後に、2024年から現在、農林水産部水産振興課での漁港施設保全計画策定業務です。\n漁港施設の点検・調査結果をもとに、補修の優先順位を設定し保全計画の策定と管理を担当しています。予算制約から委託と自主点検を組み合わせ、複数の点検業者との合同打合せで進捗・品質を統合管理しました。また補修工事において追加の補修箇所が判明した際は、漁協と調整のうえ保全計画の平準化・見直しを行い、工事監督で得た知見を係内で情報共有するなど、組織全体の業務能力向上にも努めました。\n以上、5つの経歴を通じて、経済性管理・社会環境管理を起点としながら、安全・人的資源・情報管理へと視野を広げ、複数の管理技術を統合的に活用できる技術者として成長してまいりました。", "confidence": "○（時間制約あり・要音読練習）"}, {"no": 63, "source": "経歴票（経歴１）", "group": "経歴票", "category": "経済性管理", "question": "分譲地の処理方式決定において、下水道と浄化槽のLCC比較をどう行ったか", "prep": "処理方式の決定では、整備 const groups = [...new Set(ALL_CARDS.map(c => c.group))];
let activeGroup = null;
let onlyUnmastered = false;
let deck = [...ALL_CARDS];
let order = deck.map((_,i)=>i);
let pos = 0;
let flipped = false;
let mastered = {};

const STORAGE_KEY = 'soukan_mastered_v1';

function loadMastered(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    mastered = raw ? JSON.parse(raw) : {};
  }catch(e){
    mastered = {};
  }
}
function saveMastered(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(mastered));
  }catch(e){}
}

function confClass(confidence){
  if (!confidence) return { cls:'conf-ok', label:'○' };
  if (confidence.indexOf('保留') !== -1) return { cls:'conf-pending', label:'保留' };
  if (confidence.indexOf('△') !== -1) return { cls:'conf-warn', label:'△' };
  return { cls:'conf-ok', label:'○' };
}

function renderFilters(){
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';

  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeGroup === null ? ' active' : '');
  allChip.textContent = 'すべて';
  allChip.onclick = () => { activeGroup = null; applyFilter(); };
  wrap.appendChild(allChip);

  const unmasteredChip = document.createElement('div');
  unmasteredChip.className = 'chip unmastered' + (onlyUnmastered ? ' active' : '');
  unmasteredChip.textContent = '未マスターのみ';
  unmasteredChip.onclick = () => { onlyUnmastered = !onlyUnmastered; applyFilter(); };
  wrap.appendChild(unmasteredChip);

  groups.forEach(g => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeGroup === g ? ' active' : '');
    chip.textContent = g;
    chip.onclick = () => { activeGroup = (activeGroup === g ? null : g); applyFilter(); };
    wrap.appendChild(chip);
  });
}

function applyFilter(){
  deck = ALL_CARDS.filter(c => {
    if (activeGroup && c.group !== activeGroup) return false;
    if (onlyUnmastered && mastered[c.no]) return false;
    return true;
  });
  order = deck.map((_,i)=>i);
  pos = 0;
  flipped = false;
  renderFilters();
  render();
}

function shuffle(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
}

function current(){
  if (deck.length === 0) return null;
  return deck[order[pos]];
}

function render(){
  const total = deck.length;
  document.getElementById('total').textContent = total;
  document.getElementById('totalCount').textContent = ALL_CARDS.length;
  document.getElementById('masteredCount').textContent = Object.keys(mastered).filter(k=>mastered[k]).length;

  const c = current();
  const cardEl = document.getElementById('card');
  const hintText = document.getElementById('hintText');
  const idxEl = document.getElementById('idx');
  const masterBtn = document.getElementById('masterBtn');
  const progressFill = document.getElementById('progressFill');

  cardEl.classList.toggle('flipped', flipped);

  if (!c){
    document.getElementById('mainTextFront').textContent = '該当するカードがありません。フィルタを変更してください。';
    document.getElementById('mainTextBack').textContent = '';
    document.getElementById('noLabelFront').textContent = '—';
    document.getElementById('noLabelBack').textContent = '—';
    document.getElementById('catLabelFront').textContent = '—';
    document.getElementById('catLabelBack').textContent = '—';
    document.getElementById('confBadgeFront').textContent = '';
    document.getElementById('confBadgeBack').textContent = '';
    idxEl.textContent = '0';
    progressFill.style.width = '0%';
    return;
  }

  idxEl.textContent = pos + 1;
  progressFill.style.width = ((pos+1)/total*100) + '%';

  const noStr = 'No.' + String(c.no).padStart(2,'0');
  const catStr = c.group + ' / ' + c.category;
  const conf = confClass(c.confidence);

  document.getElementById('noLabelFront').textContent = noStr;
  document.getElementById('noLabelBack').textContent = noStr;
  document.getElementById('catLabelFront').textContent = catStr;
  document.getElementById('catLabelBack').textContent = catStr;

  const badgeFront = document.getElementById('confBadgeFront');
  const badgeBack = document.getElementById('confBadgeBack');
  badgeFront.className = 'conf-badge ' + conf.cls;
  badgeFront.textContent = conf.label;
  badgeBack.className = 'conf-badge ' + conf.cls;
  badgeBack.textContent = conf.label;

  document.getElementById('mainTextFront').textContent = c.question;
  document.getElementById('mainTextBack').textContent = c.prep;

  hintText.textContent = flipped ? 'タップして表に戻る' : 'タップして裏返す — 回答案（PREP）';

  masterBtn.classList.toggle('on', !!mastered[c.no]);
  masterBtn.textContent = mastered[c.no] ? '覚えた済み ✓' : '覚えた ✓';
}

const ttsSupported = 'speechSynthesis' in window;
let jaVoice = null;
function pickJaVoice(){
  if (!ttsSupported) return;
  const voices = window.speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
}
if (ttsSupported){
  pickJaVoice();
  window.speechSynthesis.onvoiceschanged = pickJaVoice;
}
function stopSpeak(){
  if (ttsSupported) window.speechSynthesis.cancel();
}
function speakText(text, onEnd){
  if (!ttsSupported || !text) { if (onEnd) onEnd(); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = 1.0;
  if (onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}
function speakCurrentFace(){
  const c = current();
  if (!c) return;
  speakText(flipped ? c.prep : c.question);
}
function speakBoth(){
  const c = current();
  if (!c) return;
  flipped = false; render();
  speakText(c.question, () => {
    flipped = true; render();
    speakText(c.prep);
  });
}

function doFlip(){ stopSpeak(); flipped = !flipped; render(); }
function goPrev(){ if (deck.length === 0) return; stopSpeak(); pos = (pos - 1 + deck.length) % deck.length; flipped = false; render(); }
function goNext(){ if (deck.length === 0) return; stopSpeak(); pos = (pos + 1) % deck.length; flipped = false; render(); }
function toggleMaster(){
  const c = current();
  if (!c) return;
  mastered[c.no] = !mastered[c.no];
  saveMastered();
  render();
}

document.getElementById('card').addEventListener('click', doFlip);
document.getElementById('flipBtn').addEventListener('click', (e) => { e.stopPropagation(); doFlip(); });
document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('resetBtn').addEventListener('click', () => {
  activeGroup = null;
  onlyUnmastered = false;
  applyFilter();
});
document.getElementById('masterBtn').addEventListener('click', toggleMaster);
document.getElementById('speakBtn').addEventListener('click', speakCurrentFace);
document.getElementById('speakBothBtn').addEventListener('click', speakBoth);

if (!ttsSupported){
  document.getElementById('speakBtn').disabled = true;
  document.getElementById('speakBtn').textContent = '読み上げ非対応';
  document.getElementById('speakBothBtn').disabled = true;
  document.getElementById('speakBothBtn').style.opacity = '0.5';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); goNext(); }
  else if (e.key === ' ' || e.code === 'Space'){ e.preventDefault(); doFlip(); }
  else if (e.key === 's' || e.key === 'S'){ e.preventDefault(); speakCurrentFace(); }
});

let touchStartX = null;
document.getElementById('card').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].clientX;
});
document.getElementById('card').addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60){
    if (dx < 0){ goNext(); }
    else { goPrev(); }
  }
  touchStartX = null;
});

loadMastered();
renderFilters();
render();
</script>
